<body class="bg-slate-950 text-slate-100 antialiased selection:bg-emerald-500 selection:text-white">
  <div id="root">

      <h2 style="font-size:18px;font-weight:900;margin:0 0 6px 0;color:#34d399;">نظام الفوج الكشفي الرقمي</h2>
      <p style="font-size:12px;color:#94a3b8;margin:0;">جاري تشغيل وتحميل النظام الكشفي...</p>
      <style>@keyframes scoutSpin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }</style>
    </div>
  </div>

  <script>
    window.addEventListener('error', function(e) {
      console.error("Global JS error caught:", e.message);
      const root = document.getElementById("root");
      if (root && root.innerText.includes("جاري تشغيل")) {
        root.innerHTML = '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:#020617;color:#fff;text-align:center;padding:24px;font-family:sans-serif;">' +
          '<div style="background:#450a0a;border:1px solid #dc2626;padding:20px;border-radius:20px;max-width:380px;">' +
          '<h3 style="color:#f87171;font-weight:900;margin:0 0 8px 0;font-size:16px;">تنبيه في تشغيل النظام</h3>' +
          '<p style="color:#cbd5e1;font-size:12px;margin:0 0 16px 0;">حدث خطأ أثناء بدء التشغيل: ' + (e.message || "خطأ غير متوقع") + '</p>' +
          '<button onclick="location.reload()" style="background:#059669;color:#fff;border:none;padding:10px 20px;border-radius:12px;font-weight:bold;cursor:pointer;font-size:12px;">إعادة تشغيل التطبيق</button>' +
          '</div></div>';
      }
    });
  </script>
